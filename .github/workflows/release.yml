name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# tauri-action creates the draft release and uploads installers.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Code signing is optional: each block only exports its variables when the
      # matching secrets exist, so unsigned builds keep working until certificates
      # are set up (see docs/signing.md).
      - name: Apple signing env
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            {
              echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
              echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
              echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
              echo "APPLE_ID=${{ secrets.APPLE_ID }}"
              echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
              echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
            } >> "$GITHUB_ENV"
            echo "Apple signing: on"
          else
            echo "Apple signing: off (no APPLE_SIGNING_IDENTITY secret)"
          fi
      - name: Windows signing env
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            {
              echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}"
              echo "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}"
              echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}"
              echo "TAURI_WINDOWS_SIGN=1"
            } >> "$GITHUB_ENV"
            echo "Windows signing: on"
          else
            echo "Windows signing: off (no AZURE_CLIENT_ID secret)"
          fi
      - name: Install Trusted Signing tools
        if: matrix.platform == 'windows-latest' && env.TAURI_WINDOWS_SIGN == '1'
        shell: pwsh
        run: dotnet tool install --global --version 1.0.60 sign
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Deskfisch ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: deskfisch-web
          path: dist

  # Redeploys the landing site so /play/ carries the new browser build. Needs a
  # Cloudflare API token with Workers Scripts:Edit and Zone DNS:Edit for codepawl.com.
  site:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        id: token
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "CLOUDFLARE_API_TOKEN not set; skipping site deploy"; fi
      - uses: pnpm/action-setup@v4
        if: steps.token.outputs.present == 'true'
        with:
          version: 11
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.token.outputs.present == 'true'
      - run: pnpm site && npx wrangler deploy
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
