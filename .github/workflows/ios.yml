name: iOS

# Builds the iPhone/iPad app and uploads it to App Store Connect (TestFlight).
# Runs on demand or on `ios-v*` tags. Needs, as repository secrets:
#   APPLE_API_KEY_ID      App Store Connect API key id (10 chars)
#   APPLE_API_ISSUER_ID   its issuer id (uuid)
#   APPLE_API_KEY_P8      the .p8 contents, base64
# The bundle id and team come from src-tauri/tauri.ios.conf.json; Xcode's
# automatic signing (driven by the API key) registers the App ID and makes the
# distribution certificate and profile on the fly.

on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 -d > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8" >> "$GITHUB_ENV"
      - name: Xcode project
        run: pnpm tauri ios init --ci
      - name: Build (App Store export)
        env:
          APPLE_DEVELOPMENT_TEAM: D884WZQ6N4
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: pnpm tauri ios build --export-method app-store-connect
      - name: Upload to TestFlight
        run: |
          IPA=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          echo "ipa: $IPA"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "${{ secrets.APPLE_API_KEY_ID }}" --apiIssuer "${{ secrets.APPLE_API_ISSUER_ID }}"
      - uses: actions/upload-artifact@v4
        with:
          name: deskfisch-ios
          path: src-tauri/gen/apple/build/**/*.ipa
