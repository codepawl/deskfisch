[package]
name = "fisch"
version = "0.2.2"
description = "Deskfisch: a cozy pixel aquarium for your desktop"
authors = ["Nguyen Xuan An"]
edition = "2021"

[lib]
name = "fisch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2.5.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
