[package]
name = "fisch"
version = "0.3.1"
description = "Deskfisch: a cozy pixel aquarium for your desktop"
authors = ["Nguyen Xuan An"]
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "fisch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Desktop refraction: capturing what is behind the window is platform specific.
[target.'cfg(windows)'.dependencies]
xcap = "0.4"
image = { version = "0.25", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
objc2 = "0.5"
